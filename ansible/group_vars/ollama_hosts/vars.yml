---
# Ollama
ollama_model_default: qwen2.5:3b
ollama_models_extra:
  - qwen3:8b
  - nomic-embed-text
ollama_num_parallel: "4"
ollama_max_loaded_models: "3"  # classifier + main LLM + embedder
ollama_flash_attention: "1"
ollama_kv_cache_type: q8_0     # requires flash attention
ollama_keep_alive: 10m
ollama_host: "0.0.0.0:11434"

# NVIDIA — RTX 3060
# Must match the Proxmox host kernel module EXACTLY — check with `ssh proxmox nvidia-smi`.
# Installed userspace-only from NVIDIA's .run file; apt's nvidia-utils-595 floats
# to the newest 595.x point release and breaks NVML with a version mismatch.
nvidia_driver_version: "595.71.05"
nvidia_driver_branch: "595" # major branch, for purging stale apt packages
nvidia_runfile_name: "NVIDIA-Linux-x86_64-{{ nvidia_driver_version }}.run"
nvidia_runfile_url: "https://us.download.nvidia.com/XFree86/Linux-x86_64/{{ nvidia_driver_version }}/{{ nvidia_runfile_name }}"

# Open WebUI
open_webui_port: 3000
open_webui_image: "ghcr.io/open-webui/open-webui:main"
open_webui_ollama_url: "http://192.168.2.202:11434"
vault_webui_secret_key: "changeme-replace-with-secure-key"
vault_webui_admin_email: "admin@local"
vault_webui_admin_username: "admin"
vault_webui_admin_password: "changeme"

# AnythingLLM
anything_llm_port: 3001
anything_llm_image: "mintplexlabs/anythingllm:latest"
anything_llm_ollama_url: "http://192.168.2.202:11434"
